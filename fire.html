<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fireworks Display</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            text-align: center;
            z-index: 10;
            padding: 20px;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #ff0080;
        }
        
        p {
            margin-bottom: 20px;
            font-size: 1.2rem;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }
        
        button {
            padding: 10px 20px;
            background: #ff0080;
            border: none;
            border-radius: 5px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        button:hover {
            background: #ff3399;
            transform: scale(1.05);
        }
        
        canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .instructions {
            position: fixed;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 10px;
            max-width: 300px;
            z-index: 10;
        }
        
        .instructions h3 {
            margin-bottom: 10px;
            color: #ffcc00;
        }
        
        .instructions p {
            font-size: 0.9rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎆 Fireworks Display 🎇</h1>
        <p>Click anywhere to create fireworks!</p>
        <div class="controls">
            <button id="startBtn">Start Fireworks</button>
            <button id="stopBtn">Stop Fireworks</button>
            <button id="clearBtn">Clear Screen</button>
        </div>
    </div>
    
    <div class="instructions">
        <h3>How to Use:</h3>
        <p>• Click anywhere to create fireworks</p>
        <p>• Press "Start Fireworks" for automatic display</p>
        <p>• Press "Stop Fireworks" to stop automatic fireworks</p>
        <p>• Press "Clear Screen" to remove all fireworks</p>
    </div>
    
    <canvas id="fireworksCanvas"></canvas>
    
    <script>
        // Get the canvas and context
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        
        // Set canvas dimensions to match window
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        // Fireworks array to store active fireworks
        let fireworks = [];
        let autoFireworks = false;
        let autoFireworksInterval;
        
        // Particle class for individual firework particles
        class Particle {
            constructor(x, y, color, velocityX, velocityY, size = 2) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocityX = velocityX;
                this.velocityY = velocityY;
                this.size = size;
                this.alpha = 1; // For fade effect
                this.gravity = 0.05;
                this.decay = 0.015; // How quickly particles fade
            }
            
            update() {
                this.velocityY += this.gravity;
                this.x += this.velocityX;
                this.y += this.velocityY;
                this.alpha -= this.decay;
                this.size *= 0.99; // Slight size reduction
            }
            
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
        
        // Firework class for the explosion
        class Firework {
            constructor(x, y, color = null) {
                this.x = x;
                this.y = y;
                this.color = color || this.getRandomColor();
                this.particles = [];
                this.createParticles();
            }
            
            getRandomColor() {
                const colors = [
                    '#ff0000', '#00ff00', '#0000ff', '#ffff00', 
                    '#ff00ff', '#00ffff', '#ff8000', '#ff0080'
                ];
                return colors[Math.floor(Math.random() * colors.length)];
            }
            
            createParticles() {
                const particleCount = 150;
                const power = 5; // Explosion power
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = Math.random() * Math.PI * 2;
                    const velocity = Math.random() * power;
                    
                    const velocityX = Math.cos(angle) * velocity;
                    const velocityY = Math.sin(angle) * velocity;
                    
                    // Create particles with slight size variation
                    const size = Math.random() * 2 + 1;
                    
                    this.particles.push(
                        new Particle(this.x, this.y, this.color, velocityX, velocityY, size)
                    );
                }
            }
            
            update() {
                this.particles = this.particles.filter(particle => particle.alpha > 0);
                this.particles.forEach(particle => particle.update());
            }
            
            draw() {
                this.particles.forEach(particle => particle.draw());
            }
        }
        
        // Create a firework at specified position
        function createFirework(x, y, color = null) {
            fireworks.push(new Firework(x, y, color));
        }
        
        // Animation loop
        function animate() {
            // Clear canvas with a semi-transparent black to create trails
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Update and draw all fireworks
            fireworks.forEach(firework => {
                firework.update();
                firework.draw();
            });
            
            // Remove finished fireworks to save memory
            fireworks = fireworks.filter(firework => firework.particles.length > 0);
            
            requestAnimationFrame(animate);
        }
        
        // Start automatic fireworks
        function startAutoFireworks() {
            if (autoFireworks) return;
            
            autoFireworks = true;
            autoFireworksInterval = setInterval(() => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.7;
                createFirework(x, y);
            }, 500);
        }
        
        // Stop automatic fireworks
        function stopAutoFireworks() {
            autoFireworks = false;
            clearInterval(autoFireworksInterval);
        }
        
        // Clear all fireworks
        function clearFireworks() {
            fireworks = [];
            ctx.fillStyle = 'rgba(0, 0, 0, 1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }
        
        // Event listeners
        canvas.addEventListener('click', (e) => {
            createFirework(e.clientX, e.clientY);
        });
        
        document.getElementById('startBtn').addEventListener('click', startAutoFireworks);
        document.getElementById('stopBtn').addEventListener('click', stopAutoFireworks);
        document.getElementById('clearBtn').addEventListener('click', clearFireworks);
        
        // Handle window resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Start the animation
        animate();
        
        // Create initial fireworks
        for (let i = 0; i < 3; i++) {
            setTimeout(() => {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height * 0.7;
                createFirework(x, y);
            }, i * 500);
        }
    </script>
</body>
</html>
